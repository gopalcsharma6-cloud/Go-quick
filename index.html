
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f3e">
<link rel="manifest" href="manifest.json">
<title>GO QUICK - Jo Chahiye, Jab Chahiye</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7f6;color:#111;padding-bottom:100px}
.header{background:linear-gradient(135deg,#079447,#12a957);padding:18px 20px 25px;color:white}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{width:65px;height:65px;border-radius:16px;object-fit:cover;background:white}
.brand h1{font-size:32px}
.brand p{margin-top:6px}
.search{width:100%;padding:16px;border:0;border-radius:20px;font-size:17px}
.container{padding:18px}
.section-title{font-size:27px;margin-bottom:18px}
.categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:28px}
.category{background:white;border-radius:20px;padding:10px 6px 15px;text-align:center;box-shadow:0 3px 10px #0001;border:1px solid #eee;cursor:pointer}
.category img{width:100%;height:100px;object-fit:contain;background:#f7faf8;border-radius:12px;margin-bottom:10px}
.category h3{font-size:15px;line-height:1.2}
.products-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0}
.products-title h2{font-size:26px}
.count{font-size:15px;color:#777}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product{background:white;border-radius:18px;overflow:hidden;border:1px solid #eee;box-shadow:0 2px 8px #0001;padding-bottom:12px}
.product img{width:100%;height:155px;object-fit:contain;background:#f1f7f3;padding:10px}
.product-info{padding:10px}
.product-name{font-size:17px;font-weight:bold;overflow-wrap:anywhere;min-height:40px}
.product-size{font-size:14px;color:#777;margin:6px 0}
.price{font-size:18px;font-weight:bold;margin:8px 0}
.updating{color:#a16b00;font-size:14px}
.add-btn,.qty button{background:#087f3e;color:white;border:0;border-radius:9px;padding:10px;font-weight:bold}
.add-btn{width:100%;font-size:16px}
.qty{display:flex;justify-content:space-between;align-items:center;background:#087f3e;color:white;border-radius:9px}
.qty button{font-size:22px;width:42px}
.qty span{font-weight:bold}
.empty{grid-column:1/-1;text-align:center;color:#666;padding:35px 10px}
.status{font-size:14px;color:#555;margin:8px 0 16px}
.bottom-cart{position:fixed;bottom:16px;left:16px;right:16px;background:#ff7900;color:white;padding:17px;border-radius:17px;text-align:center;font-size:18px;font-weight:bold;box-shadow:0 4px 15px #0003;z-index:100}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:200;padding:15px}
.modal-box{background:white;max-width:520px;margin:25px auto;padding:20px;border-radius:20px;max-height:90vh;overflow:auto}
.modal-box h2{margin-bottom:15px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ddd}
.form input,.form textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
.form textarea{height:85px}
.action{width:100%;padding:13px;border:0;border-radius:10px;margin-top:12px;font-size:16px;font-weight:bold}
.checkout{background:#087f3e;color:white}
.close{background:#ddd}
.install{position:fixed;bottom:85px;right:15px;z-index:99;background:#16a34a;color:white;border:0;border-radius:25px;padding:12px 15px;font-weight:bold}
@media(max-width:360px){.categories{gap:7px}.category h3{font-size:13px}.products-title h2{font-size:22px}.product img{height:130px}}
</style>
</head>

<body>
<header class="header">
  <div class="brand">
    <img class="logo" src="logo.png" alt="GO QUICK Logo">
    <div><h1>GO QUICK</h1><p>Jo Chahiye, Jab Chahiye</p></div>
  </div>
  <input class="search" id="search" type="search" placeholder="🔎 Search products...">
</header>

<main class="container">
  <h2 class="section-title">Shop by category</h2>
  <div class="categories">
    <div class="category" onclick="selectCategory('Fruits & Vegetables')"><img src="tomato.jpg" alt=""><h3>Fruits &amp;<br>Vegetables</h3></div>
    <div class="category" onclick="selectCategory('Aata, Rice & Dal')"><img src="ashirvaad.jpg" alt=""><h3>Aata, Rice &amp;<br>Dal</h3></div>
    <div class="category" onclick="selectCategory('Oil, Ghee & Masala')"><img src="mustard.jpg" alt=""><h3>Oil, Ghee &amp;<br>Masala</h3></div>
    <div class="category" onclick="selectCategory('Milk & Dairy')"><img src="amul_milk.jpg" alt=""><h3>Milk &amp; Dairy</h3></div>
    <div class="category" onclick="selectCategory('Bakery & Biscuits')"><img src="white_bread.jpg" alt=""><h3>Bakery &amp;<br>Biscuits</h3></div>
    <div class="category" onclick="selectCategory('Drinks & Snacks')"><img src="soya.jpg" alt=""><h3>Drinks &amp;<br>Snacks</h3></div>
  </div>

  <div class="status" id="status">Connecting to product list...</div>

  <div class="products-title">
    <h2 id="productsHeading">All Products</h2>
    <span class="count" id="productCount">0 products</span>
  </div>
  <div class="products" id="products">
    <div class="empty">Loading products...</div>
  </div>
</main>

<div class="bottom-cart" onclick="openCart()">
  🛒 VIEW CART • <span id="cartCount">0</span> ITEMS • ₹<span id="cartTotal">0</span>
</div>

<div class="modal" id="cartModal">
  <div class="modal-box">
    <h2>🛒 Your Cart</h2>
    <div id="cartItems"></div>
    <div id="cartSummary"></div>
    <div class="form">
      <input id="customerName" placeholder="Customer Name">
      <input id="mobile" type="tel" placeholder="Mobile Number">
      <textarea id="address" placeholder="Delivery Address"></textarea>
    </div>
    <button class="action checkout" onclick="sendOrder()">📲 PLACE ORDER</button>
    <button class="action close" onclick="closeCart()">Close</button>
  </div>
</div>

<button class="install" id="installBtn">📱 Install GO QUICK</button>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbxeG5DY60jiR4JoJJegTd6ocZcx7gUygT30m-T_HXcW2uc9wJACwVCLHQ7pfw2mUwD9/exec";
const whatsappNumber = "917417482367";

let products = [];
let cart = {};
let currentCategory = "All Products";
let searchText = "";
let requestTimer = null;

const categoryMap = {
  "fruit & vegetables":"Fruits & Vegetables",
  "fruits & vegetables":"Fruits & Vegetables",
  "aata, rice & dal":"Aata, Rice & Dal",
  "atta, rice & dal":"Aata, Rice & Dal",
  "oil, ghee & masala":"Oil, Ghee & Masala",
  "milk & dairy":"Milk & Dairy",
  "bakery & biscuits":"Bakery & Biscuits",
  "drinks & snacks":"Drinks & Snacks"
};

function money(value) {
  const n = Number(value);
  if (value === "" || value === null || value === undefined || !Number.isFinite(n)) {
    return "Price updating";
  }
  return "₹" + n.toFixed(2).replace(/\.00$/, "");
}

function renderProducts() {
  const box = document.getElementById("products");
  const heading = document.getElementById("productsHeading");
  const count = document.getElementById("productCount");

  heading.textContent = currentCategory;

  const list = products.map((p, index) => ({p, index})).filter(({p}) => {
    const categoryOK = currentCategory === "All Products" || p[1] === currentCategory;
    const searchOK = !searchText ||
      p[0].toLowerCase().includes(searchText) ||
      p[1].toLowerCase().includes(searchText);
    return categoryOK && searchOK;
  });

  count.textContent = list.length + " products";

  if (!list.length) {
    box.innerHTML = '<div class="empty">' +
      (products.length ? "No products in this category." : "Products are loading or the sheet has no active products.") +
      '</div>';
    return;
  }

  box.innerHTML = list.map(({p, index}) => {
    const qty = cart[index] || 0;
    const price = typeof p[3] === "number" && Number.isFinite(p[3])
      ? '<div class="price">' + money(p[3]) + '</div>'
      : '<div class="price updating">Price updating</div>';

    const button = qty > 0
      ? '<div class="qty"><button onclick="changeQty('+index+',-1)">−</button><span>'+qty+'</span><button onclick="changeQty('+index+',1)">+</button></div>'
      : '<button class="add-btn" onclick="addToCart('+index+')">ADD</button>';

    return '<div class="product">' +
      '<img src="'+escapeHTML(p[4])+'" alt="'+escapeHTML(p[0])+'" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="product-info"><div class="product-name">'+escapeHTML(p[0])+'</div>' +
      '<div class="product-size">'+escapeHTML(p[2])+'</div>' +
      price + button + '</div></div>';
  }).join("");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function selectCategory(category) {
  currentCategory = category;
  renderProducts();
}

function addToCart(index) {
  cart[index] = (cart[index] || 0) + 1;
  renderProducts();
  updateCartBar();
}

function changeQty(index, change) {
  cart[index] = (cart[index] || 0) + change;
  if (cart[index] <= 0) delete cart[index];
  renderProducts();
  updateCartBar();
}

function totalItems() {
  return Object.values(cart).reduce((a,b) => a+b, 0);
}

function total() {
  return Object.keys(cart).reduce((sum, index) => {
    const price = products[index][3];
    return typeof price === "number" && Number.isFinite(price)
      ? sum + price * cart[index] : sum;
  }, 0);
}

function updateCartBar() {
  document.getElementById("cartCount").textContent = totalItems();
  document.getElementById("cartTotal").textContent = total().toFixed(2).replace(/\.00$/, "");
}

function openCart() {
  const items = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");

  if (!totalItems()) {
    items.innerHTML = "<p>Your cart is empty.</p>";
    summary.innerHTML = "";
  } else {
    items.innerHTML = Object.keys(cart).map(index => {
      const p = products[index];
      const qty = cart[index];
      const line = typeof p[3] === "number" ? money(p[3] * qty) : "Price updating";
      return '<div class="cart-row"><strong>'+escapeHTML(p[0])+' × '+qty+'</strong><span>'+line+'</span></div>';
    }).join("");
    summary.innerHTML = "<h3>Total: " + money(total()) + "</h3>";
  }
  document.getElementById("cartModal").style.display = "block";
}

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}

function sendOrder() {
  if (!totalItems()) {
    alert("Cart empty hai.");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const address = document.getElementById("address").value.trim();

  if (!name || !mobile || !address) {
    alert("Customer Name, Mobile Number aur Address bhariye.");
    return;
  }

  let message = "🛒 GO QUICK ORDER\n\nCustomer: " + name +
    "\nMobile: " + mobile + "\nAddress: " + address + "\n\nItems:\n";

  Object.keys(cart).forEach(index => {
    const p = products[index];
    const qty = cart[index];
    const line = typeof p[3] === "number" ? money(p[3] * qty) : "Price updating";
    message += "• " + p[0] + " (" + p[2] + ") × " + qty + " = " + line + "\n";
  });

  message += "\nTotal: " + money(total());
  window.open("https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message), "_blank");
}

document.getElementById("search").addEventListener("input", function() {
  searchText = this.value.trim().toLowerCase();
  renderProducts();
});

/* Google Sheet JSONP connection */
function loadProductsFromSheet() {
  const status = document.getElementById("status");
  status.textContent = "Connecting to Google Sheet...";

  const callbackName = "goQuickProducts_" + Date.now();
  const script = document.createElement("script");
  let finished = false;

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(requestTimer);
    delete window[callbackName];
    script.remove();
  }

  window[callbackName] = function(data) {
    if (finished) return;

    try {
      if (!Array.isArray(data)) {
        status.textContent = "Sheet response was not a product list.";
        return;
      }

      const loaded = data.filter(item => {
        const statusValue = String(item.Status ?? "on").trim().toLowerCase();
        return item.Product && statusValue !== "off";
      }).map(item => {
        const rawCategory = String(item.Category ?? "").trim();
        const category = categoryMap[rawCategory.toLowerCase()] || rawCategory;
        const rawPrice = item.Price;
        const price = rawPrice === "" || rawPrice === null || rawPrice === undefined
          ? "Price updating" : Number(rawPrice);

        return [
          String(item.Product ?? "").trim(),
          category,
          String(item.Quantity ?? "").trim(),
          price,
          String(item.Image ?? "").trim()
        ];
      }).filter(p => p[0]);

      products = loaded;
      cart = {};
      renderProducts();
      updateCartBar();

      status.textContent = loaded.length
        ? "Connected ✓ " + loaded.length + " products loaded from Google Sheet."
        : "Connected, but no active products found in the sheet.";

    } catch (error) {
      status.textContent = "Could not process the product list.";
      console.error(error);
    } finally {
      finish();
    }
  };

  script.onerror = function() {
    if (finished) return;
    status.textContent = "Could not connect to Google Sheet. Check internet and deployment URL.";
    finish();
  };

  script.src = API_URL + "?callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
  script.id = callbackName;
  document.head.appendChild(script);

  requestTimer = setTimeout(function() {
    if (finished) return;
    status.textContent = "Sheet request timed out. Refresh and try again.";
    finish();
  }, 15000);
}

renderProducts();
updateCartBar();
loadProductsFromSheet();

/* Install prompt */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById("installBtn").addEventListener("click", async function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert("Chrome ke 3 dots ⋮ par tap karein, phir 'Add to Home screen' select karein.");
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
