<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#087f3e">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO QUICK - Jo Chahiye, Jab Chahiye</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f5f7f6;
  color:#111;
  padding-bottom:100px;
}

.header{
  background:linear-gradient(135deg,#079447,#12a957);
  padding:18px 20px 28px;
  color:white;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.logo{
  width:68px;
  height:68px;
  border-radius:18px;
  object-fit:cover;
  background:white;
  border:3px solid white;
}

.brand h1{
  font-size:34px;
  line-height:1;
}

.brand p{
  font-size:17px;
  margin-top:8px;
}

.search{
  width:100%;
  border:0;
  outline:0;
  background:white;
  border-radius:22px;
  padding:18px 20px;
  font-size:20px;
  color:#333;
}

.container{
  padding:22px;
}

.section-title{
  font-size:30px;
  font-weight:800;
  margin-bottom:18px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:28px;
}

.category{
  background:white;
  border-radius:22px;
  padding:14px 10px 18px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
  cursor:pointer;
  border:1px solid #e8e8e8;
}

.category img{
  width:100%;
  height:120px;
  object-fit:contain;
  border-radius:16px;
  background:#f7faf8;
  margin-bottom:12px;
}

.category h3{
  font-size:18px;
  line-height:1.15;
}

.products-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0;
}

.products-title h2{
  font-size:30px;
}

.count{
  color:#777;
  font-size:18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:22px;
  overflow:hidden;
  border:1px solid #e5e5e5;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding-bottom:15px;
}

.product img{
  width:100%;
  height:190px;
  object-fit:contain;
  background:#f1f7f3;
  padding:12px;
}

.product-info{
  padding:12px 14px 0;
}

.product-name{
  font-size:19px;
  font-weight:800;
  min-height:46px;
}

.product-size{
  color:#777;
  margin:6px 0;
  font-size:15px;
}

.price{
  color:#a16b00;
  font-size:19px;
  font-weight:800;
  margin:7px 0;
}

.price.normal{
  color:#111;
}

.add-btn{
  width:100%;
  border:0;
  background:#0a9b4a;
  color:white;
  border-radius:12px;
  padding:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0a9b4a;
  color:white;
  border-radius:12px;
  overflow:hidden;
}

.qty button{
  width:42px;
  height:42px;
  border:0;
  background:#087c3c;
  color:white;
  font-size:24px;
}

.qty span{
  font-size:18px;
  font-weight:bold;
}

.bottom-cart{
  position:fixed;
  left:22px;
  right:22px;
  bottom:18px;
  background:#ff7900;
  color:white;
  border-radius:20px;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:800;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
  z-index:100;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:520px;
  margin:40px auto;
  border-radius:24px;
  padding:22px;
  max-height:88vh;
  overflow:auto;
}

.modal-box h2{
  margin-bottom:18px;
  font-size:28px;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.cart-row strong{
  font-size:16px;
}

.close{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  margin-top:15px;
  background:#ddd;
  font-size:17px;
}

.checkout{
  background:#0a9b4a;
  color:white;
}

.form input,
.form textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.form textarea{
  height:90px;
  resize:none;
}

@media(max-width:420px){
  .container{
    padding:18px;
  }

  .categories{
    gap:12px;
  }

  .category{
    padding:10px 6px 14px;
  }

  .category img{
    height:105px;
  }

  .category h3{
    font-size:16px;
  }

  .products{
    gap:14px;
  }

  .product img{
    height:165px;
  }

  .brand h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header class="header">

<div class="brand">
<img class="logo" src="logo.png" alt="GO QUICK Logo">
<div>
<h1>GO QUICK</h1>
<p>Jo Chahiye, Jab Chahiye</p>
</div>
</div>

<input
class="search"
id="search"
type="search"
placeholder="🔎 Search for atta, dal, milk and more..."
>

</header>

<main class="container">

<h2 class="section-title">Shop by category</h2>

<div class="categories">

<div class="category" onclick="selectCategory('Fruits & Vegetables')">
<img src="tomato.jpg" alt="Fruits & Vegetables">
<h3>Fruits &<br>Vegetables</h3>
</div>

<div class="category" onclick="selectCategory('Aata, Rice & Dal')">
<img src="ashirvaad.jpg" alt="Aata Rice Dal">
<h3>Aata, Rice &<br>Dal</h3>
</div>

<div class="category" onclick="selectCategory('Oil, Ghee & Masala')">
<img src="mustard.jpg" alt="Oil Ghee Masala">
<h3>Oil, Ghee &<br>Masala</h3>
</div>

<div class="category" onclick="selectCategory('Milk & Dairy')">
<img src="amul_milk.jpg" alt="Milk Dairy">
<h3>Milk & Dairy</h3>
</div>

<div class="category" onclick="selectCategory('Bakery & Biscuits')">
<img src="white_bread.jpg" alt="Bakery">
<h3>Bakery &<br>Biscuits</h3>
</div>

<div class="category" onclick="selectCategory('Drinks & Snacks')">
<img src="soya.jpg" alt="Drinks Snacks">
<h3>Drinks &<br>Snacks</h3>
</div>

</div>

<div class="products-title">
<h2 id="productsHeading">All Products</h2>
<span class="count" id="productCount">0 products</span>
</div>

<div class="products" id="products"></div>

</main>

<div class="bottom-cart" onclick="openCart()">
🛒 VIEW CART • <span id="cartCount">0</span> ITEMS • ₹<span id="cartTotal">0</span>
</div>

<div class="modal" id="cartModal">
<div class="modal-box">

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div id="cartSummary"></div>

<div class="form">
<input id="customerName" placeholder="Customer Name">
<input id="mobile" placeholder="Mobile Number" type="tel">
<textarea id="address" placeholder="Delivery Address"></textarea>
</div>

<button class="close checkout" onclick="sendOrder()">
📲 PLACE ORDER
</button>

<button class="close" onclick="closeCart()">Close</button>

</div>
</div>
<script>
const products = [

["Apple","Fruits & Vegetables","1 kg","200","apple.png"],
["Banana","Fruits & Vegetables","1 kg","50","banana.png"],
["Orange","Fruits & Vegetables","1 kg","Price updating","orange.jpg"],
["Tomato","Fruits & Vegetables","1 kg","70","tomato.jpg"],
["Onion","Fruits & Vegetables","1 kg","Price updating","onion.jpg"],
["Capsicum","Fruits & Vegetables","1 kg","Price updating","capsicum.jpg"],
["Carrot","Fruits & Vegetables","1 kg","Price updating","carrot.jpg"],
["Pineapple","Fruits & Vegetables","1 pc","Price updating","pineapple.jpg"],
["Spinach","Fruits & Vegetables","1 bunch","Price updating","spinach.jpg"],
["Coriander","Fruits & Vegetables","1 bunch","Price updating","coriander.jpg"],
["Cauliflower","Fruits & Vegetables","1 pc","Price updating","cauliflower.jpg"],
["Grapes","Fruits & Vegetables","1 kg","Price updating","grapes.jpg"],

["Aashirvaad Multigrains Atta","Aata, Rice & Dal","5 kg",339,"ashirvaad.jpg"],
["Fortune Chakki Fresh Atta","Aata, Rice & Dal","10 kg",485,"fortune_atta.webp"],
["Daawat Sona Masoori Rice","Aata, Rice & Dal","1 kg",89,"daawat.jpg"],
["Daawat Sona Masoori Rice","Aata, Rice & Dal","10 kg",738,"daawat.jpg"],
["Toor Dal","Aata, Rice & Dal","500 g",91.50,"daawat.jpg"],
["Toor Dal","Aata, Rice & Dal","1 kg",183,"daawat.jpg"],
["Moong Dal Chilka","Aata, Rice & Dal","500 g",89,"daawat.jpg"],
["Chana Dal","Aata, Rice & Dal","500 g",67,"daawat.jpg"],
["Masoor Dal","Aata, Rice & Dal","500 g",72,"daawat.jpg"],
["Besan","Aata, Rice & Dal","1 kg",99,"daawat.jpg"],
["Sooji","Aata, Rice & Dal","500 g",34,"daawat.jpg"],
["Maida","Aata, Rice & Dal","500 g",47,"daawat.jpg"],

["Fortune Premium Kachi Ghani Mustard Oil","Oil, Ghee & Masala","1 kg",198,"mustard.jpg"],
["Fortune Soya Health Refined Soyabean Oil","Oil, Ghee & Masala","1 kg",178,"soya.jpg"],
["Amul Pure Ghee","Oil, Ghee & Masala","1 kg",631,"amul_ghee.jpg"],
["Patanjali Cow's Ghee","Oil, Ghee & Masala","1 kg",747,"patanjali_ghee.jpg"],
["Patanjali Cow's Ghee","Oil, Ghee & Masala","200 ml",180,"patanjali_ghee.jpg"],

["Amul Gold Milk","Milk & Dairy","500 ml",36,"amul_milk.jpg"],
["Amul Masti Dahi","Milk & Dairy","200 g",25,"amul_dahi.jpg"],
["Amul Masti Dahi","Milk & Dairy","500 g",35,"amul_dahi.jpg"],

["Mrs. Bector's English Oven White Bread","Bakery & Biscuits","Pack",70,"white_bread.jpg"],
["Mrs. Bector's English Oven Burger Buns","Bakery & Biscuits","6 pcs / 300 g",55,"burger_buns.jpg"],
["Britannia Zero Maida Atta Bread","Bakery & Biscuits","Pack",60,"britannia_bread.jpg"]

];

let cart = {};
let currentCategory = "All Products";
let searchText = "";

const productBox = document.getElementById("products");
const search = document.getElementById("search");

function money(value){
  if(value === "Price updating") return value;
  return "₹" + Number(value).toLocaleString("en-IN");
}

function renderProducts(){

  let filtered = products.filter(p => {

    const categoryMatch =
      currentCategory === "All Products" ||
      p[1] === currentCategory;

    const searchMatch =
      p[0].toLowerCase().includes(searchText.toLowerCase()) ||
      p[1].toLowerCase().includes(searchText.toLowerCase());

    return categoryMatch && searchMatch;
  });

  productBox.innerHTML = "";

  filtered.forEach((p,index) => {

    const originalIndex = products.indexOf(p);
    const qty = cart[originalIndex] || 0;

    const priceHTML =
      p[3] === "Price updating"
      ? `<div class="price">Price updating</div>`
      : `<div class="price normal">${money(p[3])}</div>`;

    let buttonHTML = "";

    if(p[3] === "Price updating"){

      buttonHTML = `
        <button class="add-btn" disabled
        style="background:#aaa;cursor:not-allowed">
        Price Updating
        </button>
      `;

    }else if(qty === 0){

      buttonHTML = `
        <button class="add-btn"
        onclick="addToCart(${originalIndex})">
        ADD
        </button>
      `;

    }else{

      buttonHTML = `
        <div class="qty">

          <button onclick="changeQty(${originalIndex},-1)">
          −
          </button>

          <span>${qty}</span>

          <button onclick="changeQty(${originalIndex},1)">
          +
          </button>

        </div>
      `;
    }

    productBox.innerHTML += `

      <div class="product">

        <img
          src="${p[4]}"
          alt="${p[0]}"
          onerror="this.style.display='none'"
        >

        <div class="product-info">

          <div class="product-name">
            ${p[0]}
          </div>

          <div class="product-size">
            ${p[2]}
          </div>

          ${priceHTML}

          ${buttonHTML}

        </div>

      </div>

    `;
  });

  document.getElementById("productCount").textContent =
    filtered.length + " products";

  document.getElementById("productsHeading").textContent =
    currentCategory;

  updateCartBar();
}

function selectCategory(category){

  currentCategory = category;

  search.value = "";
  searchText = "";

  renderProducts();

  window.scrollTo({
    top:document.querySelector(".products-title").offsetTop - 20,
    behavior:"smooth"
  });
}

function addToCart(index){

  cart[index] = 1;

  renderProducts();
}

function changeQty(index,change){

  cart[index] = (cart[index] || 0) + change;

  if(cart[index] <= 0){
    delete cart[index];
  }

  renderProducts();
}

function totalItems(){

  return Object.values(cart).reduce(
    (sum,qty)=>sum+qty,0
  );
}

function total(){

  return Object.keys(cart).reduce((sum,index)=>{

    const p = products[index];

    if(p[3] === "Price updating") return sum;

    return sum + Number(p[3]) * cart[index];

  },0);
}

function updateCartBar(){

  document.getElementById("cartCount").textContent =
    totalItems();

  document.getElementById("cartTotal").textContent =
    total().toLocaleString("en-IN");
}

search.oninput = function(){

  searchText = this.value;

  currentCategory = "All Products";

  renderProducts();
};
function openCart(){

  const modal = document.getElementById("cartModal");
  const items = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");

  items.innerHTML = "";

  if(totalItems() === 0){

    items.innerHTML = `
      <p style="padding:20px 0;text-align:center;color:#777">
        Your cart is empty.
      </p>
    `;

  }else{

    Object.keys(cart).forEach(index => {

      const p = products[index];
      const qty = cart[index];

      items.innerHTML += `

        <div class="cart-row">

          <div>
            <strong>${p[0]}</strong>
            <br>
            <small>${p[2]} × ${qty}</small>
          </div>

          <div>
            <strong>
              ₹${(Number(p[3]) * qty).toLocaleString("en-IN")}
            </strong>

            <br>

            <button
              onclick="changeQty(${index},-1);openCart()"
              style="
                border:0;
                background:#eee;
                border-radius:7px;
                padding:5px 10px;
                margin-top:5px;
              ">
              −
            </button>

            <button
              onclick="changeQty(${index},1);openCart()"
              style="
                border:0;
                background:#0a9b4a;
                color:white;
                border-radius:7px;
                padding:5px 10px;
                margin-top:5px;
              ">
              +
            </button>

          </div>

        </div>
      `;
    });
  }

  summary.innerHTML = `
    <div style="
      display:flex;
      justify-content:space-between;
      font-size:21px;
      font-weight:800;
      padding:18px 0;
    ">
      <span>Total</span>
      <span>₹${total().toLocaleString("en-IN")}</span>
    </div>
  `;

  modal.style.display = "block";
}

function closeCart(){

  document.getElementById("cartModal").style.display = "none";
}

function sendOrder(){

  if(totalItems() === 0){

    alert("Please add at least one product to cart.");

    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const address =
    document.getElementById("address").value.trim();

  if(!name || !mobile || !address){

    alert(
      "Please fill Customer Name, Mobile Number and Delivery Address."
    );

    return;
  }

  let message = `*GO QUICK ORDER*

Customer Name: ${name}

Mobile No.: ${mobile}

Delivery Address:
${address}

*ORDER ITEMS:*
`;

  Object.keys(cart).forEach(index => {

    const p = products[index];
    const qty = cart[index];

    message +=
      `• ${p[0]} (${p[2]}) × ${qty} = ₹${(
        Number(p[3]) * qty
      ).toLocaleString("en-IN")}\n`;
  });

  message += `

*TOTAL: ₹${total().toLocaleString("en-IN")}*

Thank you for ordering from GO QUICK.`;

  /*
   * IMPORTANT:
   * YAHAN APNA GO QUICK WHATSAPP NUMBER LIKHNA HAI.
   * Example: 91XXXXXXXXXX
   * +, spaces aur brackets mat lagana.
   */

  const whatsappNumber = "917417482367";
  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.location.href = whatsappURL;
}

window.onclick = function(event){

  const modal = document.getElementById("cartModal");

  if(event.target === modal){

    closeCart();
  }
};

renderProducts();
updateCartBar();

</script>
<button id="installBtn" style="
position:fixed;
bottom:20px;
right:20px;
z-index:9999;
background:#16a34a;
color:white;
border:none;
border-radius:30px;
padding:14px 20px;
font-size:16px;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
">
📱 Install GO QUICK
</button>
<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById("installBtn").addEventListener("click", async function() {

  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert("Chrome ke 3 dots ⋮ par tap karein, phir 'Add to Home screen' select karein.");
  }

});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js")
      .then(function() {
        console.log("GO QUICK Service Worker registered");
      })
      .catch(function(error) {
        console.log("Service Worker error:", error);
      });
  });
}
</script>
</body>
</html>
